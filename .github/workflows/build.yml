name: Build & Release

# Construit les installateurs de Mapli Drive (Windows, macOS) à chaque tag vX.Y.Z et les
# dépose sur app.mapli.fr/downloads/drive : les postes s'y mettent à jour (latest.yml) et
# le coffre-fort web y pointe (noms fixes « Mapli-Drive-Setup.exe » et « Mapli-Drive.dmg »).
# Rien ne dépend de GitHub côté postes : le dépôt peut rester privé.
on:
  push:
    tags: ['v*']
  # Lancement à la main : construit sans publier, sauf s'il est lancé sur un tag.
  workflow_dispatch:

permissions:
  contents: read

env:
  RCLONE_VERSION: v1.75.1
  # Empreintes officielles (https://downloads.rclone.org/v1.75.1/SHA256SUMS).
  RCLONE_SHA256_WINDOWS: 200eb602c126d82aa38b51e0f6b9ae837473ff99b51278d3f6f837574c494d6e
  RCLONE_SHA256_MAC_ARM64: c61d7a371c62bcbbe882c3423aa4b8bf63485c248dd0f692997b8f0c3f6d0c6f
  RCLONE_SHA256_MAC_AMD64: 29253d0288b8fbbac46baad6e5f6add6cb01d462c79f10805bbd4631c4cdf82c
  WINFSP_URL: https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
  WINFSP_SHA256: 073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a

jobs:
  build-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - name: Tag and version match
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME ≠ package.json $version"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Tests propres à Windows (assistant de l'Explorateur réel, tasklist) : ci.yml tourne
      # sous Linux et les saute. Une version ne part pas sans eux.
      - run: npm test

      - name: Download rclone (checksum verified)
        shell: pwsh
        run: |
          $zip = "rclone-$env:RCLONE_VERSION-windows-amd64.zip"
          Invoke-WebRequest -Uri "https://downloads.rclone.org/$env:RCLONE_VERSION/$zip" -OutFile rclone.zip
          $hash = (Get-FileHash rclone.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:RCLONE_SHA256_WINDOWS) { throw "rclone: empreinte inattendue ($hash)" }
          Expand-Archive rclone.zip -DestinationPath rclone-tmp
          Copy-Item "rclone-tmp/rclone-$env:RCLONE_VERSION-windows-amd64/rclone.exe" "resources/rclone.exe"
          Remove-Item rclone.zip, rclone-tmp -Recurse -Force

      - name: Download WinFsp MSI (checksum verified)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:WINFSP_URL -OutFile "build/winfsp.msi"
          $hash = (Get-FileHash build/winfsp.msi -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:WINFSP_SHA256) { throw "WinFsp: empreinte inattendue ($hash)" }

      - run: npm run package -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            dist/Mapli-Drive-Setup-*.exe
            dist/Mapli-Drive-Setup-*.exe.blockmap
            dist/latest.yml

  # macOS : rclone sert le coffre en NFS, monté par le client NFS du système (ni extension
  # noyau, ni droits d'administrateur) ; binaire universel (Apple Silicon et Intel).
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Les deux archives vérifiées par leurs empreintes épinglées, réunies par lipo.
      - name: Download rclone (checksums verified, universal)
        run: node scripts/fetch-rclone.mjs

      - run: npm run package:mac -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: |
            dist/Mapli-Drive-*.dmg
            dist/Mapli-Drive-*-mac.zip
            dist/*.blockmap
            dist/latest-mac.yml

  # Dépôt sur app.mapli.fr. La clé de la CI ne sert qu'à ça : sur le serveur, elle est
  # limitée par rrsync à l'écriture dans /mnt/data/mapli/downloads/drive (pas de shell).
  publish:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    concurrency: publish-downloads
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare the files
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir drive
          cp artifacts/* drive/
          cd drive
          # Les fichiers annoncés existent bien, pour cette version.
          grep -q "path: Mapli-Drive-Setup-$version.exe" latest.yml
          grep -q "path: Mapli-Drive-$version-mac.zip" latest-mac.yml
          test -s "Mapli-Drive-Setup-$version.exe" && test -s "Mapli-Drive-$version.dmg"
          # Liens stables du coffre-fort web : la dernière version sous un nom fixe.
          cp "Mapli-Drive-Setup-$version.exe" Mapli-Drive-Setup.exe
          cp "Mapli-Drive-$version.dmg" Mapli-Drive.dmg
          sha256sum -- * > "SHA256SUMS-$version"
          ls -la

      - name: SSH key
        env:
          DEPLOY_KEY: ${{ secrets.DRIVE_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.DRIVE_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/drive_deploy
          chmod 600 ~/.ssh/drive_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload to app.mapli.fr
        env:
          DEPLOY_HOST: ${{ secrets.DRIVE_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DRIVE_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh_cmd="ssh -i $HOME/.ssh/drive_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes"
          # Les installateurs d'abord (mis en place ensemble à la fin de l'envoi), les
          # fichiers de mise à jour ensuite : un poste ne voit jamais une version
          # annoncée avant ses fichiers.
          rsync -rtp --chmod=D755,F644 --delay-updates --exclude 'latest*.yml' -e "$ssh_cmd" drive/ "$DEPLOY_USER@$DEPLOY_HOST:"
          rsync -rtp --chmod=D755,F644 -e "$ssh_cmd" drive/latest.yml drive/latest-mac.yml "$DEPLOY_USER@$DEPLOY_HOST:"

      - name: Check the downloads
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          base=https://app.mapli.fr/downloads/drive
          curl -fsS "$base/latest.yml" | grep -q "^version: $version$"
          curl -fsS "$base/latest-mac.yml" | grep -q "^version: $version$"
          for f in "Mapli-Drive-Setup-$version.exe" Mapli-Drive-Setup.exe "Mapli-Drive-$version.dmg" Mapli-Drive.dmg; do
            curl -fsSI "$base/$f" > /dev/null && echo "ok  $base/$f"
          done
